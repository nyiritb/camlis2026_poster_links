<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAMLIS 2026 Poster | Tamás Nyíri</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            color: #ffffff;
            background:
                radial-gradient(circle at top, #1e3a5f 0%, #0f172a 48%, #080d19 100%);
        }

        .container {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        .card {
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.82);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .conference-label {
            margin: 0 0 10px;
            color: #60a5fa;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 8vw, 2.8rem);
        }

        h2 {
            margin: 28px 0 12px;
            font-size: 1.45rem;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .status {
            margin: 28px 0;
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
        }

        .icon {
            display: block;
            margin-bottom: 12px;
            font-size: 2.3rem;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 56px;
            margin-top: 12px;
            padding: 15px 24px;

            color: #ffffff;
            font-weight: 650;
            text-decoration: none;

            background: #2563eb;
            border-radius: 14px;

            transition:
                transform 160ms ease,
                background-color 160ms ease,
                box-shadow 160ms ease;
        }

        .button:hover {
            background: #1d4ed8;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.3);
            transform: translateY(-2px);
        }

        .button:focus-visible,
        .back-link:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #93c5fd;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .time {
            color: #ffffff;
            font-weight: 650;
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card">
            <p class="conference-label">Conference poster</p>

            <h1>CAMLIS 2026</h1>

            <div id="poster-status" class="status" aria-live="polite">
                <span class="icon" aria-hidden="true">⏳</span>
                <p>Checking poster availability…</p>
            </div>

            <a class="back-link" href="index.html">
                ← Back to all links
            </a>
        </section>
    </main>

    <script>
        /*
         * Release time:
         * October 22, 2026 at 4:00 PM Eastern Daylight Time.
         *
         * The explicit -04:00 offset ensures that visitors in other
         * time zones see the poster released at the same moment.
         */
        const releaseDate = new Date("2026-10-22T16:00:00-04:00");
        const posterStatus = document.getElementById("poster-status");

        function updatePosterAvailability() {
            const currentTime = new Date();

            if (currentTime >= releaseDate) {
                posterStatus.innerHTML = `
                    <span class="icon" aria-hidden="true">📄</span>
                    <h2>The poster is available</h2>
                    <p>
                        View or download the CAMLIS 2026 poster as a PDF.
                    </p>
                    <a
                        class="button"
                        href="poster.pdf"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Open Poster PDF
                    </a>
                `;
            } else {
                posterStatus.innerHTML = `
                    <span class="icon" aria-hidden="true">📄</span>
                    <h2>Poster coming soon</h2>
                    <p>
                        The poster will become available on
                        <span class="time">
                            October 22, 2026 at 4:00 PM Eastern Time
                        </span>.
                    </p>
                `;
            }
        }

        updatePosterAvailability();

        // Keep the page open across the release time and update automatically.
        setInterval(updatePosterAvailability, 30000);
    </script>
</body>
</html>

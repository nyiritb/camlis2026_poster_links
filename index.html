<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAMLIS 2026 | Tamás Nyíri</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            color: #ffffff;
            background:
                radial-gradient(circle at top, #1e3a5f 0%, #0f172a 48%, #080d19 100%);
        }

        .container {
            width: 100%;
            max-width: 460px;
            text-align: center;
        }

        .card {
            padding: 36px 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.82);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .conference-label {
            margin: 0 0 10px;
            color: #60a5fa;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 8vw, 2.8rem);
            line-height: 1.1;
        }

        .subtitle {
            margin: 14px 0 32px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .links {
            display: grid;
            gap: 14px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
            padding: 16px 20px;

            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 650;
            text-decoration: none;

            background: #2563eb;
            border: 1px solid transparent;
            border-radius: 14px;

            transition:
                transform 160ms ease,
                background-color 160ms ease,
                box-shadow 160ms ease;
        }

        .link:hover {
            background: #1d4ed8;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.3);
            transform: translateY(-2px);
        }

        .link:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        .link.secondary {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .link.secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }

        footer {
            margin-top: 28px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card">
            <p class="conference-label">Conference resources</p>

            <h1>CAMLIS 2026</h1>

            <p class="subtitle">
                Poster, professional profile, and related Sophos research.
            </p>

            <nav class="links" aria-label="CAMLIS 2026 links">
                <a class="link" href="https://static1.squarespace.com/static/6984143bcde8d50f1d1ea61d/t/6ad81ee31a14143f2e54f594/1792548579482/tam_camlis_poster_final_version_after_bens_comments_2.pdf">
                    📄 View Poster
                </a>

                <a
                    class="link secondary"
                    href="https://www.linkedin.com/in/nyiritb/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    💼 LinkedIn
                </a>

                <a
                    class="link secondary"
                    href="https://www.sophos.com/en-us/blog"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ✍️ Sophos Blog
                </a>
            </nav>

            <footer>
                Tamás Nyíri
            </footer>
        </section>
    </main>
</body>
</html>
